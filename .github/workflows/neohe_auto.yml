name: NeoHeberg Auto Farmer

on:
  workflow_dispatch:

jobs:
  farming:
    runs-on: ubuntu-latest
    timeout-minutes: 120 
    permissions:
      contents: write
      actions: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: ⚙️ 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🛠️ 安装底层图形与系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            x11-utils \
            xdotool \
            scrot \
            fonts-noto-cjk

      - name: 📦 安装 Python 核心依赖
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: 🛠️ 安装并启动 sing-box 代理
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$NODE_LINK" ]; then
            echo "ℹ️ 未配置 NODE_LINK Secret，将使用 GitHub Actions 本地网络直连。"
            echo "LOCAL_PROXY=" >> $GITHUB_ENV
          else
            echo "📥 获取 sing-box 最新版本..."
            API_RESP=$(curl -sf -H "Authorization: token ${GH_TOKEN}" \
              https://api.github.com/repos/SagerNet/sing-box/releases/latest)
            if [ -z "$API_RESP" ]; then
              echo "❌ GitHub API 请求失败（可能被限流）"
              exit 1
            fi
            SINGBOX_VER=$(echo "$API_RESP" | sed -n 's/.*"tag_name"[[:space:]]*:[[:space:]]*"v\{0,1\}\([^"]*\)".*/\1/p')
            
            TARBALL="sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
            DL_URL="https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/${TARBALL}"
            curl -fLo sing-box.tar.gz "$DL_URL"
            tar -xzf sing-box.tar.gz
            cp "sing-box-${SINGBOX_VER}-linux-amd64/sing-box" ./sing-box
            chmod +x ./sing-box

            echo "📝 转换节点链接为 sing-box 配置..."
            python3 convert.py "$NODE_LINK"

            echo "🚀 启动 sing-box..."
            nohup ./sing-box run -c config.json > sing-box.log 2>&1 &
            SINGBOX_PID=$!
            sleep 3

            echo "⏳ 正在预热隧道并验证连通性 (带重试机制)..."
            PROXY_OK=false
            # 循环探测 6 次，每次超时 5 秒，失败则等待 3 秒
            for i in {1..6}; do
              # 【修复】：改回 http://
              if curl -x http://127.0.0.1:8080 -s --max-time 5 https://api.ip.sb/ip; then
                PROXY_OK=true
                break
              fi
              echo "⏳ 隧道握手中，等待 3 秒后重试 ($i/6)..."
              sleep 3
            done

            if [ "$PROXY_OK" = true ]; then
              echo ""
              echo "✅ sing-box 代理全速贯通！(PID: $SINGBOX_PID)"
              # 【修复】：传给 Python 脚本的也是 http://
              echo "LOCAL_PROXY=http://127.0.0.1:8080" >> $GITHUB_ENV
            else
              echo ""
              echo "❌ 代理连通性测试彻底失败，节点可能已离线！"
              # 安全打印日志，防止 cat 命令本身报错
              if [ -f "sing-box.log" ]; then 
                echo "📄 附: sing-box 运行崩溃日志："
                cat sing-box.log 
              else 
                echo "⚠️ 未在当前目录找到 sing-box.log" 
              fi
              # 杀掉僵尸进程并退出报错
              kill $SINGBOX_PID || true
              exit 1
            fi
          fi

      - name: 🚀 运行 NeoHeberg 自动脚本
        env:
          NEOH_AUTH: ${{ secrets.NEOH_AUTH }}
          NEOH_COOKIE: ${{ secrets.NEOH_COOKIE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 自动接收上一步传来的 SOCKS5 代理地址
          PROXY: ${{ env.LOCAL_PROXY }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 neohe-sb.py

      - name: 📸 上传崩溃与调试截图 (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neohe-debug-screenshots
          path: "*.png"
          retention-days: 3

      - name: 🧹 清理历史工作流记录
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=50 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 3 ]; then
              gh run delete $run_id || true
            fi
          done
